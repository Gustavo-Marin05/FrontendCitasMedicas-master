<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacientes</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:400,700"
    />
    <link rel="stylesheet" href="css2/fontawesome.min.css" />
    <link rel="stylesheet" href="css2/bootstrap.min.css" />
    <link rel="stylesheet" href="css2/templatemo-style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background-color: #435C70;
        margin: 5% auto;
        padding: 20px;
        width: 90%;
        max-width: 800px;
        border-radius: 8px;
        max-height: 80%; /* Limitar la altura máxima del contenido */
        overflow-y: auto; /* Habilitar el scroll vertical */
      }

      .modal-content h2,
      .modal-content h3,
      .modal-content div,
      .modal-content select,
      .modal-content input,
      .modal-content button {
        margin-top: 10px;
      }

      .close {
        float: right;
        font-size: 10px;
        cursor: pointer;
      }

    </style>
  </head>
  <body id="reportsPage">
    <nav class="navbar navbar-expand-xl w-100">
      <div class="container h-100">
        <a class="navbar-brand" href="/">
          <img
            src="img/LogoRH.png"
            alt="Logo Admin"
            class="mr-2"
            style="height: 50px"
          />
          <h1 class="tm-site-title mb-0">Dentis Admin</h1>
        </a>
        <button
          class="navbar-toggler ml-auto mr-0"
          type="button"
          data-toggle="collapse"
          data-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="fas fa-bars tm-nav-icon"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mx-auto h-100">
            <li class="nav-item">
              <a class="nav-link active" href="/">
                <i class="fas fa-tachometer-alt"></i>
                Dashboard
                <span class="sr-only">(current)</span>
              </a>
            </li>

            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="navbarDropdown"
                role="button"
                data-toggle="dropdown"
                aria-haspopup="true"
                aria-expanded="false"
              >
                <i class="far fa-file-alt"></i>
                Citas
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                <a class="dropdown-item" href="/appointments"
                  >Gestionar Citas</a
                >
                <a class="dropdown-item" href="/appointmentsByDoctorDate"
                  >Consultar por Médico y Fecha</a
                >
              </div>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/doctors">
                <i class="far fa-user"></i>
                Doctores
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/patients">
                <i class="far fa-user"></i>
                Pacientes
              </a>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link d-block" href="login.html" id="logoutBtn">
                <b>cerrar secion</b>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row tm-content-row">
        <div class="col-12 tm-block-col">
          <div class="tm-bg-primary-dark tm-block tm-block-products">
            <div class="tm-product-table-container">
              <table
                class="table table-hover tm-table-small tm-product-table"
                id="patientsTable" style="display: none;"
              >
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Telefono</th>
                    <th>Género</th>
                    <th>Operaciones</th>
                  </tr>
                </thead>
                <tbody id="patientsList"></tbody>
              </table>
            </div>
            <!-- table container -->
            <a
              id="addPatientBtn"
              class="btn btn-primary btn-block text-uppercase mb-3"
              onclick="openModal(`patientForm`)"
              >Agregar paciente</a>
          </div>
        </div>
      </div>
    </div>
    <!-- Formulario para agregar/editar paciente -->
    <div id="patientForm" style="display: none;" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal('patientForm')">&times;</span>
        <form>
          <input type="hidden" id="patientId"><br>
          <label>Nombre: <input id="name" required></label><br>
          <label>Email: <input id="email" type="email" required></label><br>
          <label>Teléfono: <input id="phone" required></label><br>
          <label>Género: 
            <select id="gender">
              <option value="masculino">Masculino</option>
              <option value="femenino">Femenino</option>
              <option value="otro">Otro</option>
            </select>
          </label><br>
          <button type="submit" onclick="closeModal(`patientForm`)">Guardar</button>
          <button type="button" id="cancelPatientForm" onclick="closeModal(`patientForm`)">Cancelar</button>
        </form>
      </div>
    </div>

    <!-- Modal para mostrar receta de un paciente -->
    <div id="recipeModal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close" onclick="closeModal('recipeModal')">&times;</span>
        <h2>Receta del Paciente</h2>
        <div id="recipeContent"></div>
      </div>
    </div>

    <!-- Modal para agregar receta a un paciente -->
    <div id="formModalAddRecipe" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close" onclick="closeModal('formModalAddRecipe')">&times;</span>
        <h2>Agregar Receta</h2>
        <label for="medicationSelect">Medicamento:</label>
        <select id="medicationSelect"></select>
        <label for="dosage">Dosificación:</label>
        <input type="text" id="dosage" required>
        <label for="frequency">Frecuencia:</label>
        <input type="text" id="frequency" required>
        <button id="addRecipeBtn">Agregar</button>
      </div>
    </div>

    <script src="js/scripts.js"></script>
    <script src="js/patients.js"></script>


   <script src="js2/jquery-3.3.1.min.js"></script>
    <script src="js2/bootstrap.min.js"></script>
  </body>
</html>
